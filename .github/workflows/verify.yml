# Continuous integration.
#
# Two jobs, because they answer different questions:
#
#   verify        — do the gates and the test suite pass on this commit?
#   compatibility — would a given DSH version actually load this plugin?
#
# The second one is the reason this file exists at all. `0.1.0` shipped with a
# peer range that no local check questioned, and every user's install was
# rejected by the host. The mismatch is invisible to a test suite that never
# asks the host's own question, so the host's question is asked here, once per
# supported DSH version.
#
# No Figma quota is used: the 14 live-data tests skip without `.env.local`, and
# `check:test-counts` asserts that they skipped.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: gates and tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The suite includes a real 24-second timer test, so this is generous on
    # purpose rather than tight.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `engines` claims >=20, and that claim was untested until the first CI
        # run found that `node --test <dir>` means one thing on 26 and another
        # on 22. Both ends of the claimed range are now actually exercised.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `check:secrets` scans every commit's content and
          # message, and a shallow clone would make that scan quietly vacuous.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        # `npm install`, not `npm ci`: this repository deliberately ships no
        # lockfile, and the host packages are peers (npm 7+ installs them).
        run: npm install --no-audit --no-fund

      - name: Gates and tests
        run: npm run verify

  compatibility:
    name: dsh ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dsh:
          # Oldest supported, and the version the bundle install smoke was run on.
          - '0.2.0-rc.2'
          # Open-source web release currently on npm `latest`.
          - '0.2.1-rc.2'
          # Desktop app currently deployed.
          - '0.2.1-rc.3'
          # npm `next`, to catch a patch regression before it ships.
          - '0.2.1-rc.4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Would dsh ${{ matrix.dsh }} load this plugin?
        run: npm run check:deps -- --runtime ${{ matrix.dsh }}

      # Negative control, run once: both ends of the range must be real. Without
      # this, a range that quietly grew an open upper bound would still pass
      # every cell above, and a lower bound that drifted would never be noticed.
      - name: Out-of-range versions are refused
        if: matrix.dsh == '0.2.0-rc.2'
        run: |
          for version in 0.1.5-rc.2 0.3.0-rc.1; do
            if npm run check:deps -- --runtime "$version"; then
              echo "::error::dsh $version was accepted — the peer range boundary is wrong"
              exit 1
            fi
            echo "dsh $version refused, as intended"
          done
